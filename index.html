<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>영어 암기</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <meta name="theme-color" content="#378ADD" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 시작 화면 -->
  <section id="start-screen" class="screen">
    <p class="start-logo">TUK TAK</p>
    <button id="start-btn" class="btn btn-primary">시작하기</button>
  </section>

  <!-- 카드 학습 화면 -->
  <main id="card-screen" class="screen hidden">
    <div class="screen-actions">
      <button id="add-open-btn" class="text-link-btn">+ 문장 추가</button>
      <button id="import-open-btn" class="text-link-btn">파일 가져오기</button>
      <button id="sheet-open-btn" class="text-link-btn">구글시트 연동</button>
      <input id="import-file-input" type="file" accept=".csv,.tsv,.txt" class="hidden" />
    </div>

    <div class="card">
      <p id="kr-text" class="kr-text"></p>
      <p id="en-text" class="en-text hidden"></p>
    </div>

    <div class="control-bar">
      <button id="prev-btn" class="btn btn-outline">이전</button>
      <button id="check-btn" class="btn btn-outline">확인</button>
      <button id="next-btn" class="btn btn-outline">다음</button>
    </div>
  </main>

  <!-- 문장 추가 모달 -->
  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 class="modal-title">문장 추가</h2>
      <label class="modal-label" for="add-kr-input">한국어</label>
      <input id="add-kr-input" class="modal-input" type="text" placeholder="예) 오늘 날씨가 어때?" />
      <label class="modal-label" for="add-en-input">영어</label>
      <input id="add-en-input" class="modal-input" type="text" placeholder="예) How is the weather?" />
      <div class="modal-actions">
        <button id="add-cancel-btn" class="btn btn-outline modal-btn">취소</button>
        <button id="add-submit-btn" class="btn modal-btn modal-btn-submit">추가</button>
      </div>
    </div>
  </div>

  <!-- 구글시트 연동 모달 -->
  <div id="sheet-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 class="modal-title">구글시트 연동</h2>
      <label class="modal-label" for="sheet-url-input">웹에 게시(CSV) 링크</label>
      <input id="sheet-url-input" class="modal-input" type="url" placeholder="https://docs.google.com/.../pub?output=csv" />
      <div class="modal-actions">
        <button id="sheet-cancel-btn" class="btn btn-outline modal-btn">취소</button>
        <button id="sheet-submit-btn" class="btn modal-btn modal-btn-submit">가져오기</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
