<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>영어 암기</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192x192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
  <meta name="theme-color" content="#0C447C" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- 시작 화면 -->
  <section id="start-screen" class="screen">
    <p class="start-logo">TUK TAK</p>
    <button id="start-btn" class="btn btn-primary">시작하기</button>
  </section>

  <!-- 카드 학습 화면 -->
  <main id="card-screen" class="screen hidden">
    <header class="card-topbar">
      <span class="topbar-logo">TUK TAK</span>
      <div class="topbar-more">
        <button id="more-open-btn" class="topbar-more-btn" aria-label="더보기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
        <div id="more-menu" class="more-menu hidden">
          <button id="add-open-btn" class="more-menu-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
            <span>문장추가</span>
          </button>
          <button id="list-open-btn" class="more-menu-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" x2="21" y1="6" y2="6"/><line x1="8" x2="21" y1="12" y2="12"/><line x1="8" x2="21" y1="18" y2="18"/><line x1="3" x2="3.01" y1="6" y2="6"/><line x1="3" x2="3.01" y1="12" y2="12"/><line x1="3" x2="3.01" y1="18" y2="18"/></svg>
            <span>문장관리</span>
          </button>
          <button id="settings-open-btn" class="more-menu-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            <span>설정</span>
          </button>
        </div>
      </div>
    </header>

    <div class="card">
      <p id="kr-text" class="kr-text"></p>
      <p id="en-text" class="en-text hidden"></p>
      <div id="card-mark-bar" class="card-mark-bar hidden">
        <button id="card-star-btn" class="card-mark-btn" type="button" aria-label="중요 표시">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        </button>
        <button id="card-flag-btn" class="card-mark-btn" type="button" aria-label="미암기 표시">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" x2="4" y1="22" y2="15"/></svg>
        </button>
        <span class="card-mark-divider"></span>
        <button id="card-edit-btn" class="card-mark-btn" type="button" aria-label="문장 수정">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .622.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>
        </button>
        <button id="card-delete-btn" class="card-mark-btn" type="button" aria-label="문장 삭제">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        </button>
      </div>
      <p id="empty-state-msg" class="empty-state-msg hidden">문장이 없습니다.<br />더보기 &gt; 문장추가로 새 문장을 등록해주세요.</p>
    </div>

    <div class="control-bar">
      <button id="prev-btn" class="btn btn-outline">이전</button>
      <button id="check-btn" class="btn btn-outline">확인</button>
      <button id="next-btn" class="btn btn-outline">다음</button>
    </div>
  </main>

  <!-- 문장 관리 화면 (목록 보기 + 수정/삭제) -->
  <section id="list-screen" class="screen hidden">
    <header id="list-topbar" class="screen-topbar">
      <button id="list-back-btn" class="screen-back-btn" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span id="list-topbar-title" class="screen-topbar-title">문장 관리</span>
      <button id="list-select-btn" class="screen-topbar-text-btn" type="button">선택</button>
      <button id="list-bulk-delete-btn" class="screen-topbar-text-btn screen-topbar-delete-btn hidden" type="button">삭제</button>
    </header>
    <div id="list-filter-bar" class="list-filter-bar">
      <button class="list-filter-btn active" type="button" data-filter="all">전체</button>
      <button class="list-filter-btn" type="button" data-filter="important">중요</button>
      <button class="list-filter-btn" type="button" data-filter="unfamiliar">미암기</button>
    </div>
    <div id="sentence-list" class="sentence-list"></div>
  </section>

  <!-- 설정 화면 -->
  <section id="settings-screen" class="screen hidden">
    <header class="screen-topbar">
      <button id="settings-back-btn" class="screen-back-btn" aria-label="뒤로가기">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <span class="screen-topbar-title">설정</span>
    </header>

    <div class="settings-body">
      <div class="settings-row settings-row-fontsize">
        <div class="settings-row-top">
          <span class="settings-row-label">글자크기</span>
          <span id="font-size-sample" class="font-size-sample">가</span>
        </div>
        <div class="settings-row-bottom">
          <div class="font-size-dots">
            <span class="font-size-dot" data-index="1"></span>
            <span class="font-size-dot" data-index="2"></span>
            <span class="font-size-dot" data-index="3"></span>
            <span class="font-size-dot" data-index="4"></span>
            <span class="font-size-dot" data-index="5"></span>
          </div>
          <div class="stepper">
            <button id="font-size-dec-btn" class="stepper-btn" type="button" aria-label="글자 작게">&minus;</button>
            <button id="font-size-inc-btn" class="stepper-btn" type="button" aria-label="글자 크게">+</button>
          </div>
        </div>
      </div>

      <div class="settings-row settings-row-fontsize">
        <div class="settings-row-top">
          <span class="settings-row-label">화면모드</span>
        </div>
        <div class="mode-select" role="radiogroup" aria-label="화면모드 선택">
          <button id="mode-system-btn" class="mode-select-btn" type="button" role="radio" data-mode="system">시스템</button>
          <button id="mode-light-btn" class="mode-select-btn" type="button" role="radio" data-mode="light">라이트</button>
          <button id="mode-dark-btn" class="mode-select-btn" type="button" role="radio" data-mode="dark">다크</button>
        </div>
      </div>

      <div class="settings-row settings-row-fontsize">
        <div class="settings-row-top">
          <span class="settings-row-label">출제/정렬 순서</span>
        </div>
        <div class="sort-option-list" role="radiogroup" aria-label="출제/정렬 순서 선택">
          <button class="sort-option-btn" type="button" role="radio" data-sort="random">
            <span class="sort-option-radio"></span>
            <span>랜덤순</span>
          </button>
          <button class="sort-option-btn" type="button" role="radio" data-sort="newest">
            <span class="sort-option-radio"></span>
            <span>최신순</span>
          </button>
          <button class="sort-option-btn" type="button" role="radio" data-sort="oldest">
            <span class="sort-option-radio"></span>
            <span>오래된순</span>
          </button>
          <button class="sort-option-btn" type="button" role="radio" data-sort="unfamiliar">
            <span class="sort-option-radio"></span>
            <span>못외운것 먼저</span>
          </button>
          <button class="sort-option-btn" type="button" role="radio" data-sort="important">
            <span class="sort-option-radio"></span>
            <span>중요한것 먼저</span>
          </button>
        </div>
      </div>

      <div class="settings-section-title">데이터 관리</div>

      <button id="export-backup-btn" class="btn btn-outline settings-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>
        <span>백업 내보내기</span>
      </button>

      <button id="reset-open-btn" class="btn btn-outline settings-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
        <span>초기화</span>
      </button>

      <p class="settings-footer">TukTak · 최근 업데이트 2026-08-13</p>
    </div>
  </section>

  <!-- 문장 추가/수정 모달: 추가 시 [폼 입력/파일 가져오기/텍스트 붙여넣기] 탭 전환, 수정 시 탭 숨기고 폼만 노출 -->
  <div id="add-modal" class="modal-overlay hidden">
    <div class="modal-box">
      <h2 id="add-modal-title" class="modal-title">문장 추가</h2>

      <div id="add-modal-tabs" class="add-modal-tabs" role="tablist">
        <button class="add-modal-tab-btn active" type="button" data-tab="form">폼 입력</button>
        <button class="add-modal-tab-btn" type="button" data-tab="file">파일 가져오기</button>
        <button class="add-modal-tab-btn" type="button" data-tab="paste">텍스트 붙여넣기</button>
      </div>

      <div id="add-tab-form" class="add-modal-tab-panel">
        <label class="modal-label" for="add-kr-input">한국어</label>
        <input id="add-kr-input" class="modal-input" type="text" placeholder="예) 오늘 날씨가 어때?" />
        <label class="modal-label" for="add-en-input">영어</label>
        <input id="add-en-input" class="modal-input" type="text" placeholder="예) How is the weather?" />
        <div class="modal-actions">
          <button id="add-cancel-btn" class="btn btn-outline modal-btn">취소</button>
          <button id="add-submit-btn" class="btn modal-btn modal-btn-submit">추가</button>
        </div>
      </div>

      <div id="add-tab-file" class="add-modal-tab-panel hidden">
        <p class="modal-desc">엑셀/메모장 등에서 만든 CSV·TSV·TXT 파일을 선택하세요.</p>
        <input id="import-file-input" type="file" accept=".csv,.tsv,.txt" class="hidden" />
        <div class="modal-actions">
          <button id="import-tab-cancel-btn" class="btn btn-outline modal-btn">취소</button>
          <button id="import-tab-open-btn" class="btn modal-btn modal-btn-submit">파일 선택</button>
        </div>
      </div>

      <div id="add-tab-paste" class="add-modal-tab-panel hidden">
        <p class="modal-desc">한 줄에 문장 하나씩, 한국어와 영어를 탭·쉼표로 구분해서 붙여넣으세요.</p>
        <textarea id="paste-textarea" class="modal-textarea" placeholder="오늘 날씨가 어때?	How is the weather?"></textarea>
        <div class="modal-actions">
          <button id="paste-cancel-btn" class="btn btn-outline modal-btn">취소</button>
          <button id="paste-submit-btn" class="btn modal-btn modal-btn-submit">가져오기</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
